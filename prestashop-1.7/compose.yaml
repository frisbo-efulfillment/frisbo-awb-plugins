services:
  shop:
    build:
      context: ./docker/php72
      args:
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./shop:/var/www/html
      - ./modules:/workspace/modules
      - ./docker/php72/php-dev.ini:/usr/local/etc/php/conf.d/99-prestashop-dev.ini:ro
    environment:
      PS_DOMAIN: ${PS_DOMAIN:-localhost:8080}
      PS_ADMIN_DIR: ${PS_ADMIN_DIR:-admin-dev}
      DB_SERVER: db
      DB_PORT: 3306
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWORD: prestashop
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Dev123456!}
    restart: unless-stopped

  db:
    image: mariadb:10.3
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: prestashop
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  db-data:

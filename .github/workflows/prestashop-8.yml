name: prestashop-8

on:
  push:
    branches:
      - master
    paths:
      - prestashop8/modules/frisbo_awb/**

permissions:
  contents: write

concurrency:
  group: prestashop-8-release
  cancel-in-progress: false

jobs:
  php-compatibility:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "7.2"
          - "7.3"
          - "7.4"
          - "8.0"
          - "8.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check module PHP syntax
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/prestashop8/modules/frisbo_awb:/module:ro" \
            "php:${{ matrix.php }}-cli" \
            sh -ec 'find /module -type f -name "*.php" -exec php -l {} \;'

  prestashop-compatibility:
    name: PrestaShop ${{ matrix.prestashop }} install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        prestashop:
          - "8.2.8"
          - "8.2.7"
          - "8.2.6"
          - "8.2.5"
          - "8.2.4"
          - "8.2.3"
          - "8.2.2"
          - "8.2.1"
          - "8.2.0"
          - "8.1.7"
          - "8.1.6"
          - "8.1.5"
          - "8.1.4"
          - "8.1.3"
          - "8.1.2"
          - "8.1.1"
          - "8.1.0"
          - "8.0.4"
          - "8.0.2"
          - "8.0.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install module on PrestaShop
        shell: bash
        env:
          PRESTASHOP_VERSION: ${{ matrix.prestashop }}
        run: |
          set -euo pipefail
          ./prestashop8/scripts/test-module-version.sh "$PRESTASHOP_VERSION"

  release:
    name: Package and release frisbo_awb for PrestaShop 8
    runs-on: ubuntu-latest
    needs:
      - php-compatibility
      - prestashop-compatibility

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create PrestaShop module ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          release_tag="v$(date -u +'%Y-%m-%d_%H%M%S')"
          archive_name="frisbo_awb-prestashop8-${release_tag}.zip"

          mkdir -p build dist
          cp -a prestashop8/modules/frisbo_awb build/frisbo_awb
          find build/frisbo_awb -type f \( -name '.DS_Store' -o -name '*.swp' \) -delete

          test -f build/frisbo_awb/frisbo_awb.php
          (cd build && zip -q -r "../dist/${archive_name}" frisbo_awb)
          sha256sum "dist/${archive_name}" > "dist/${archive_name}.sha256"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            "dist/$ARCHIVE_NAME" \
            "dist/$ARCHIVE_NAME.sha256" \
            --target "$GITHUB_SHA" \
            --title "PrestaShop 8 - $RELEASE_TAG" \
            --notes "Tested with PrestaShop 8.2.0-8.2.8, 8.1.0-8.1.7, 8.0.1, 8.0.2, and 8.0.4; compatible with PHP 7.2.5 through PHP 8.1." \
            --generate-notes

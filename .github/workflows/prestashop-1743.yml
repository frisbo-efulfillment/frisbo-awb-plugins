name: prestashop-1743

on:
  push:
    branches:
      - master
    paths:
      - prestashop-1.7/modules/frisbo_awb/**

permissions:
  contents: write

concurrency:
  group: prestashop-1743-release
  cancel-in-progress: false

jobs:
  compatibility:
    name: PHP ${{ matrix.php }} compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "7.2"
          - "7.4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check module PHP syntax
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/prestashop-1.7/modules/frisbo_awb:/module:ro" \
            "php:${{ matrix.php }}-cli" \
            sh -ec 'find /module -type f -name "*.php" -exec php -l {} \;'

  release:
    name: Package and release frisbo_awb
    runs-on: ubuntu-latest
    needs:
      - compatibility

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create PrestaShop module ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          release_tag="v$(date -u +'%Y-%m-%d_%H%M%S')"
          archive_name="frisbo_awb-${release_tag}.zip"

          mkdir -p build dist
          cp -a prestashop-1.7/modules/frisbo_awb build/frisbo_awb
          find build/frisbo_awb -type f \( -name '.DS_Store' -o -name '*.swp' \) -delete

          test -f build/frisbo_awb/frisbo_awb.php
          (cd build && zip -q -r "../dist/${archive_name}" frisbo_awb)
          sha256sum "dist/${archive_name}" > "dist/${archive_name}.sha256"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            "dist/$ARCHIVE_NAME" \
            "dist/$ARCHIVE_NAME.sha256" \
            --target "$GITHUB_SHA" \
            --title "PrestaShop 1.7 - $RELEASE_TAG" \
            --notes "Compatibility: PrestaShop 1.7.4.3 through 1.7.8.11; PHP 7.2 through PHP 7.4." \
            --generate-notes
